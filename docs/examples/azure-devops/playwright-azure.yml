trigger: none
pr: none
pool:
  vmImage: ubuntu-latest
variables:
  - group: fab-demo
steps:
  - checkout: self
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
  - script: python -m pip install -e ".[dev]" "playwright==1.63.0" "pytest-playwright==0.9.0"
    displayName: Install this feature checkout and Python plugins
  - bash: |
      set -euo pipefail
      mkdir -p fab-test-results
      fab-test doctor
      fab-test playwright --artifact "$PLAYWRIGHT_ARTIFACT" --env DEV --report \
        --playwright-config "$PLAYWRIGHT_CONFIG_PATH" --workers 8
    displayName: Check readiness and validate
    env:
      FABRIC_TENANT_ID: $(FABRIC_TENANT_ID)
      FABRIC_CLIENT_ID: $(FABRIC_CLIENT_ID)
      FABRIC_CLIENT_SECRET: $(FABRIC_CLIENT_SECRET)
      FABRIC_WORKSPACE_ID: $(FABRIC_WORKSPACE_ID)
      FABRIC_ENVIRONMENT: DEV
      PLAYWRIGHT_SERVICE_URL: $(PLAYWRIGHT_SERVICE_URL)
      PLAYWRIGHT_SERVICE_ACCESS_TOKEN: $(PLAYWRIGHT_SERVICE_ACCESS_TOKEN)
      PLAYWRIGHT_ARTIFACT: $(PLAYWRIGHT_ARTIFACT)
      PLAYWRIGHT_CONFIG_PATH: docs/examples/playwright/azure.yml
  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: 'fab-test-results/playwright/**/report/results.xml'
      failTaskOnFailedTests: false
      testRunTitle: Playwright Azure browsers
  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: fab-test-results
      artifact: playwright-azure-results