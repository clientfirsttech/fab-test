name: Playwright Azure browsers
on:
  workflow_dispatch:
    inputs:
      artifact:
        description: Deployed report name
        required: true
        default: Not Working Visuals
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    environment: fab-demo
    env:
      FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
      FABRIC_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
      FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
      FABRIC_WORKSPACE_ID: ${{ vars.FABRIC_WORKSPACE_ID }}
      FABRIC_ENVIRONMENT: DEV
      PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL || secrets.PLAYWRIGHT_SERVICE_URL }}
      PLAYWRIGHT_SERVICE_ACCESS_TOKEN: ${{ secrets.PLAYWRIGHT_SERVICE_ACCESS_TOKEN }}
      PLAYWRIGHT_CONFIG_PATH: docs/examples/playwright/azure.yml
      TARGET_ARTIFACT: ${{ inputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install this feature checkout and Python plugins
        run: python -m pip install -e ".[dev]" "playwright==1.63.0" "pytest-playwright==0.9.0"
      - name: Check readiness and validate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fab-test-results
          fab-test doctor
          fab-test playwright --artifact "$TARGET_ARTIFACT" --env DEV --report \
            --playwright-config "$PLAYWRIGHT_CONFIG_PATH" --workers 8
      - name: Publish JUnit and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-azure-results
          path: fab-test-results/
          if-no-files-found: warn