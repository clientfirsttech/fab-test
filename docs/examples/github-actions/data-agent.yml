name: fab-test data-agent
on:
  workflow_dispatch:
    inputs:
      artifact:
        description: "Optional NAME.DataAgent target under .DataAgent/** with promptfooconfig.yaml"
        required: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Validate authored Data Agent prompts
        run: |
          fab-test doctor --analyzer data-agent
          fab-test data-agent --workspace "${FABRIC_WORKSPACE_ID}" --report
        env:
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          FABRIC_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
          FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fab-test-data-agent-results
          path: fab-test-results
