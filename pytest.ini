[pytest]
testpaths = tests
markers =
    bpa: Contract tests for the BPA wrapper — always pass locally (CLI surface, envelope schema, artifact discovery)
    pbir: Contract tests for the PBIR Inspector wrapper — always pass locally
    a11y: Contract tests for the pbir-a11y wrapper — always pass locally
    pql_test: Contract tests for the pql-test wrapper — always pass locally
    pql_lint: Contract tests for the pql-lint wrapper — always pass locally
    prompt_lint: Contract tests for the prompt-lint wrapper — always pass locally
    rdl: Contract tests for the rdl (paginated report) wrapper — always pass locally, no external tool required
    analyzers: Aggregate selector for all contract-tier analyzer tests
    integration: Any test that invokes a real external tool or service; legitimately skips when unavailable
    fab_test: Contract tests for the fab-test CLI surface — always pass locally (help output, subcommand structure, dry-run discovery)
    playwright: Playwright visual/error validation tests — may skip when browser dependencies are unavailable
    telemetry: Contract tests for Eventhouse telemetry — always pass locally, no cluster required
