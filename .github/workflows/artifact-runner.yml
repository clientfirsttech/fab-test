  deploy-phase-3:
    name: Deploy Phase 3 - ${{ matrix.name }}
    needs: [prepare-matrix, static-linux, static-windows, ai-governance, deploy-phase-2]
    if: |
      always() &&
      needs.prepare-matrix.outputs.phase_3_has_artifacts == 'true' &&
      (needs.static-linux.result == 'success' || needs.static-linux.result == 'skipped') &&
      (needs.static-windows.result == 'success' || needs.static-windows.result == 'skipped') &&
      (needs.ai-governance.result == 'success' || needs.ai-governance.result == 'skipped') &&
      (needs.deploy-phase-2.result == 'success' || needs.deploy-phase-2.result == 'skipped')
    runs-on: ubuntu-latest

    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.phase_3_matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python virtual environment
        uses: ./.github/actions/setup-venv

      - name: Deploy artifact
        env:
          FABRIC_WORKSPACE_ID: ${{ matrix.workspace_id }}
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          FABRIC_SERVICE_PRINCIPAL_ID: ${{ secrets.FABRIC_SERVICE_PRINCIPAL_ID }}
          FABRIC_SERVICE_PRINCIPAL_SECRET: ${{ secrets.FABRIC_SERVICE_PRINCIPAL_SECRET }}
        run: |
          echo "### 🚀 Deploying ${{ matrix.name }} to ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact Details**:" >> $GITHUB_STEP_SUMMARY
          echo "- Name: ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Type: ${{ matrix.type }}" >> $GITHUB_STEP_SUMMARY
          echo "- Path: ${{ matrix.path }}" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Phase: 3" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Command** (Constraint C2):" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'python scripts/deploy.py \\' >> $GITHUB_STEP_SUMMARY
          echo '  --artifact "${{ matrix.path }}" \\' >> $GITHUB_STEP_SUMMARY
          echo '  --environment "${{ matrix.environment }}"' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          $VENV_PYTHON scripts/deploy.py \
            --artifact "${{ matrix.path }}" \
            --environment "${{ matrix.environment }}"

  # Constraint C5: Testbed isolation validation before dynamic tests
  testbed-validation:
    name: Testbed Validation - ${{ matrix.name }}
    needs: [prepare-matrix, deploy-phase-0, deploy-phase-1, deploy-phase-2, deploy-phase-3]
    if: |
      always() &&
      needs.prepare-matrix.outputs.has_artifacts == 'true' &&
      (needs.deploy-phase-0.result == 'success' || needs.deploy-phase-0.result == 'skipped') &&
      (needs.deploy-phase-1.result == 'success' || needs.deploy-phase-1.result == 'skipped') &&
      (needs.deploy-phase-2.result == 'success' || needs.deploy-phase-2.result == 'skipped') &&
      (needs.deploy-phase-3.result == 'success' || needs.deploy-phase-3.result == 'skipped') &&
      (github.ref_name == 'testbed' || startsWith(github.ref_name, 'feature/') || startsWith(github.ref_name, 'release/'))
    uses: ./.github/workflows/testbed.yml

    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false

    with:
      artifact_name: ${{ matrix.name }}
      artifact_type: ${{ matrix.type }}
      artifact_path: ${{ matrix.path }}

  # Build impacted-report manifest from changed artifacts for Playwright.
  playwright-impact:
    name: Playwright Impact Manifest
    needs: [prepare-matrix, deploy-phase-0, deploy-phase-1, deploy-phase-2, deploy-phase-3, testbed-validation]
    if: |
      always() &&
      inputs.run_dynamic == true &&
      needs.prepare-matrix.outputs.has_playwright_impact == 'true' &&
      (needs.deploy-phase-0.result == 'success' || needs.deploy-phase-0.result == 'skipped') &&
      (needs.deploy-phase-1.result == 'success' || needs.deploy-phase-1.result == 'skipped') &&
      (needs.deploy-phase-2.result == 'success' || needs.deploy-phase-2.result == 'skipped') &&
      (needs.deploy-phase-3.result == 'success' || needs.deploy-phase-3.result == 'skipped') &&
      (needs.testbed-validation.result == 'success' || needs.testbed-validation.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      has_impacted_reports: ${{ steps.impact.outputs.has_impacted_reports }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download package wheel
        uses: actions/download-artifact@v4
        with:
          name: package-wheel
          path: dist

      - name: Install package wheel
        run: |
          pip install --quiet dist/*.whl
          echo "### 📦 Installed $(basename dist/*.whl)" >> $GITHUB_STEP_SUMMARY

      - name: Download changed artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifact-matrix

      - name: Check Fabric credentials
        id: credentials
        run: |
          if [ -z "${{ secrets.FABRIC_SERVICE_PRINCIPAL_ID }}" ] || [ -z "${{ secrets.FABRIC_SERVICE_PRINCIPAL_SECRET }}" ] || [ -z "${{ secrets.FABRIC_TENANT_ID }}" ]; then
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "::warning::Fabric service principal credentials are missing; skipping Playwright impact manifest."
          else
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          fi

      - name: Build Playwright impact manifest
        id: impact
        if: steps.credentials.outputs.has_credentials == 'true'
        env:
          FABRIC_SERVICE_PRINCIPAL_ID: ${{ secrets.FABRIC_SERVICE_PRINCIPAL_ID }}
          FABRIC_SERVICE_PRINCIPAL_SECRET: ${{ secrets.FABRIC_SERVICE_PRINCIPAL_SECRET }}
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          FABRIC_ENVIRONMENT: ${{ inputs.target_environment }}
          FABRIC_WORKSPACE_ID: ${{ needs.prepare-matrix.outputs.workspace_id }}
        run: |
          echo "### 🎯 Playwright Impact Manifest" >> $GITHUB_STEP_SUMMARY
          fab-test playwright-impact \
            --changed-artifacts changed-artifacts.json \
            --env "${{ inputs.target_environment }}" \
            --workspace-id "${{ needs.prepare-matrix.outputs.workspace_id }}" \
            --output analyzer-results/playwright/impact-manifest.json

          REPORT_COUNT=$(jq '.reports | length' analyzer-results/playwright/impact-manifest.json)
          if [ "$REPORT_COUNT" -gt 0 ]; then
            echo "has_impacted_reports=true" >> $GITHUB_OUTPUT
          else
            echo "has_impacted_reports=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Playwright impact manifest
        if: always() && steps.credentials.outputs.has_credentials == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-impact-manifest
          path: analyzer-results/playwright/impact-manifest.json
          retention-days: 7

      - name: Skip Playwright impact without credentials
        if: steps.credentials.outputs.has_credentials == 'false'
        run: |
          echo "::notice::Skipped Playwright impact manifest due to missing credentials."
          echo "has_impacted_reports=false" >> $GITHUB_OUTPUT

  # Playwright visual validation driven by the service-resolved impact manifest.
  playwright:
    name: Playwright Visual Validation
    needs: [prepare-matrix, deploy-phase-0, deploy-phase-1, deploy-phase-2, deploy-phase-3, testbed-validation, playwright-impact]
    if: |
      always() &&
      inputs.run_dynamic == true &&
      needs.prepare-matrix.outputs.has_playwright_impact == 'true' &&
      needs.playwright-impact.outputs.has_impacted_reports == 'true' &&
      (needs.deploy-phase-0.result == 'success' || needs.deploy-phase-0.result == 'skipped') &&
      (needs.deploy-phase-1.result == 'success' || needs.deploy-phase-1.result == 'skipped') &&
      (needs.deploy-phase-2.result == 'success' || needs.deploy-phase-2.result == 'skipped') &&
      (needs.deploy-phase-3.result == 'success' || needs.deploy-phase-3.result == 'skipped') &&
      (needs.testbed-validation.result == 'success' || needs.testbed-validation.result == 'skipped') &&
      (needs.playwright-impact.result == 'success' || needs.playwright-impact.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download package wheel
        uses: actions/download-artifact@v4
        with:
          name: package-wheel
          path: dist

      - name: Install package wheel
        run: |
          pip install --quiet dist/*.whl
          echo "### 📦 Installed $(basename dist/*.whl)" >> $GITHUB_STEP_SUMMARY

      - name: Check Fabric credentials
        id: credentials
        run: |
          if [ -z "${{ secrets.FABRIC_SERVICE_PRINCIPAL_ID }}" ] || [ -z "${{ secrets.FABRIC_SERVICE_PRINCIPAL_SECRET }}" ] || [ -z "${{ secrets.FABRIC_TENANT_ID }}" ]; then
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "::warning::Fabric service principal credentials are missing; skipping Playwright visual validation."
          else
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          fi

      - name: Download Playwright impact manifest
        if: steps.credentials.outputs.has_credentials == 'true'
        uses: actions/download-artifact@v4
        with:
          name: playwright-impact-manifest
          path: analyzer-results/playwright

      - name: Install Playwright browsers
        if: steps.credentials.outputs.has_credentials == 'true'
        run: python -m playwright install chromium

      - name: Run Playwright validation via fab-test
        if: steps.credentials.outputs.has_credentials == 'true'
        env:
          FABRIC_SERVICE_PRINCIPAL_ID: ${{ secrets.FABRIC_SERVICE_PRINCIPAL_ID }}
          FABRIC_SERVICE_PRINCIPAL_SECRET: ${{ secrets.FABRIC_SERVICE_PRINCIPAL_SECRET }}
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          FABRIC_ENVIRONMENT: ${{ inputs.target_environment }}
          FABRIC_WORKSPACE_ID: ${{ needs.prepare-matrix.outputs.workspace_id }}
        run: |
          echo "### 🎭 Playwright Visual Validation" >> $GITHUB_STEP_SUMMARY
          fab-test playwright \
            --impact-manifest analyzer-results/playwright/impact-manifest.json \
            --env "${{ inputs.target_environment }}" \
            --workspace-id "${{ needs.prepare-matrix.outputs.workspace_id }}" \
            --format json

      - name: Upload Playwright evidence
        if: always() && steps.credentials.outputs.has_credentials == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-validation-${{ github.run_id }}
          path: |
            analyzer-results/playwright/**
            playwright-report/
            test-results/
          retention-days: 7

      - name: Skip Playwright without credentials
        if: steps.credentials.outputs.has_credentials == 'false'
        run: |
          echo "::notice::Skipped Playwright visual validation due to missing credentials."

  # Constraint C4/C5: Dynamic validation after successful testbed validation
  dynamic-linux:
    name: Dynamic Analyzer - ${{ matrix.analyzer_name }} - ${{ matrix.artifact_name }}
    needs: [prepare-matrix, deploy-phase-0, deploy-phase-1, deploy-phase-2, deploy-phase-3, testbed-validation]
    if: |
      always() &&
      inputs.run_dynamic == true &&
      needs.prepare-matrix.outputs.has_dynamic_analyzers == 'true' &&
      (needs.deploy-phase-0.result == 'success' || needs.deploy-phase-0.result == 'skipped') &&
      (needs.deploy-phase-1.result == 'success' || needs.deploy-phase-1.result == 'skipped') &&
      (needs.deploy-phase-2.result == 'success' || needs.deploy-phase-2.result == 'skipped') &&
      (needs.deploy-phase-3.result == 'success' || needs.deploy-phase-3.result == 'skipped') &&
      (needs.testbed-validation.result == 'success' || needs.testbed-validation.result == 'skipped')
    runs-on: ubuntu-latest

    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.dynamic_analyzer_matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download package wheel
        uses: actions/download-artifact@v4
        with:
          name: package-wheel
          path: dist

      - name: Install package wheel
        run: |
          pip install --quiet dist/*.whl
          echo "### 📦 Installed $(basename dist/*.whl)" >> $GITHUB_STEP_SUMMARY

      - name: Check Fabric credentials
        id: credentials
        run: |
          if [ -z "${{ secrets.FABRIC_SERVICE_PRINCIPAL_ID }}" ] || [ -z "${{ secrets.FABRIC_SERVICE_PRINCIPAL_SECRET }}" ] || [ -z "${{ secrets.FABRIC_TENANT_ID }}" ]; then
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "::warning::Fabric service principal credentials are missing; skipping dynamic analyzer."
          else
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          fi

      - name: Run dynamic analyzer via fab-test
        if: steps.credentials.outputs.has_credentials == 'true'
        env:
          FABRIC_SERVICE_PRINCIPAL_ID: ${{ secrets.FABRIC_SERVICE_PRINCIPAL_ID }}
          FABRIC_SERVICE_PRINCIPAL_SECRET: ${{ secrets.FABRIC_SERVICE_PRINCIPAL_SECRET }}
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          FABRIC_ENVIRONMENT: ${{ matrix.environment }}
          FABRIC_WORKSPACE_ID: ${{ matrix.workspace_id }}
        run: |
          echo "### 🧪 Dynamic Analyzer — ${{ matrix.analyzer_name }} / ${{ matrix.artifact_name }}" >> $GITHUB_STEP_SUMMARY
          fab-test ${{ matrix.analyzer_name }} \
            --artifact "${{ matrix.artifact_name }}" \
            --env "${{ matrix.environment }}" \
            --workspace-id "${{ matrix.workspace_id }}" \
            --format json

      - name: Upload dynamic analyzer output and envelope
        if: always() && steps.credentials.outputs.has_credentials == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.analyzer_name }}-${{ matrix.artifact_name }}-${{ github.run_id }}-${{ strategy.job-index }}
          path: analyzer-results/${{ matrix.analyzer_name }}/${{ matrix.artifact_name }}/**
          retention-days: 7

      - name: Skip dynamic analyzer without credentials
        if: steps.credentials.outputs.has_credentials == 'false'
        run: |
          echo "::notice::Skipped ${{ matrix.analyzer_name }} for ${{ matrix.artifact_name }} due to missing credentials."

  # Constraint C9: Telemetry is optional and never mandatory
  telemetry:
    name: Telemetry - ${{ matrix.name }}
    needs: [prepare-matrix, static-linux, static-windows, ai-governance, deploy-phase-0, deploy-phase-1, deploy-phase-2, deploy-phase-3, testbed-validation, dynamic-linux, playwright-impact, playwright]
    if: |
      always() &&
      needs.prepare-matrix.outputs.has_artifacts == 'true' &&
      inputs.run_telemetry == true
    uses: ./.github/workflows/reusable-telemetry.yml

    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false

    with:
      artifact_name: ${{ matrix.name }}
      artifact_type: ${{ matrix.type }}
      analysis_type: deployment
      results: |
        {
          "static_linux": "${{ needs.static-linux.result }}",
          "static_windows": "${{ needs.static-windows.result }}",
          "deploy_phase_0": "${{ needs.deploy-phase-0.result }}",
          "deploy_phase_1": "${{ needs.deploy-phase-1.result }}",
          "deploy_phase_2": "${{ needs.deploy-phase-2.result }}",
          "deploy_phase_3": "${{ needs.deploy-phase-3.result }}",
          "dynamic_linux": "${{ needs.dynamic-linux.result }}",
          "playwright_impact": "${{ needs.playwright-impact.result }}",
          "playwright": "${{ needs.playwright.result }}",
          "workflow_run_id": "${{ github.run_id }}",
          "workflow_run_number": "${{ github.run_number }}",
          "repository": "${{ github.repository }}",
          "actor": "${{ github.actor }}"
        }
      commit_sha: ${{ github.sha }}
      environment: ${{ matrix.environment }}
