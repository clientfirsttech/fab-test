name: Artifact Runner

on:
  workflow_call:
    inputs:
      changed_artifacts:
        required: true
        type: string
        description: JSON string of changed artifacts from detect-changes
      target_environment:
        required: true
        type: string
        description: Target environment (testbed, dev, test, prod)
      run_static:
        required: false
        type: boolean
        default: true
        description: Run static analysis
      run_dynamic:
        required: false
        type: boolean
        default: true
        description: Run dynamic validation
      run_telemetry:
        required: false
        type: boolean
        default: false
        description: Enable telemetry logging

permissions:
  contents: read

jobs:
  prepare-matrix:
    name: Prepare Artifact Matrix
    runs-on: ubuntu-latest
    
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      has_artifacts: ${{ steps.build.outputs.has_artifacts }}
      static_analyzer_matrix: ${{ steps.build_analyzer_matrices.outputs.static_analyzer_matrix }}
      has_static_analyzers: ${{ steps.build_analyzer_matrices.outputs.has_static_analyzers }}
      dynamic_analyzer_matrix: ${{ steps.build_analyzer_matrices.outputs.dynamic_analyzer_matrix }}
      has_dynamic_analyzers: ${{ steps.build_analyzer_matrices.outputs.has_dynamic_analyzers }}
      pbir_matrix: ${{ steps.build_fab_test_matrices.outputs.pbir_matrix }}
      has_pbir: ${{ steps.build_fab_test_matrices.outputs.has_pbir }}
      bpa_matrix: ${{ steps.build_fab_test_matrices.outputs.bpa_matrix }}
      has_bpa: ${{ steps.build_fab_test_matrices.outputs.has_bpa }}
      wheel_name: ${{ steps.build_wheel.outputs.wheel_name }}
      phase_count: ${{ steps.build_deploy_plan.outputs.phase_count }}
      phase_0_matrix: ${{ steps.build_deploy_plan.outputs.phase_0_matrix }}
      phase_0_has_artifacts: ${{ steps.build_deploy_plan.outputs.phase_0_has_artifacts }}
      phase_1_matrix: ${{ steps.build_deploy_plan.outputs.phase_1_matrix }}
      phase_1_has_artifacts: ${{ steps.build_deploy_plan.outputs.phase_1_has_artifacts }}
      phase_2_matrix: ${{ steps.build_deploy_plan.outputs.phase_2_matrix }}
      phase_2_has_artifacts: ${{ steps.build_deploy_plan.outputs.phase_2_has_artifacts }}
      phase_3_matrix: ${{ steps.build_deploy_plan.outputs.phase_3_matrix }}
      phase_3_has_artifacts: ${{ steps.build_deploy_plan.outputs.phase_3_has_artifacts }}
      workspace_id: ${{ steps.build.outputs.workspace_id }}
      has_playwright_impact: ${{ steps.build.outputs.has_playwright_impact }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Load metadata files
        id: metadata
        run: |
          # Load all metadata files
          echo "Loading metadata contracts..."
          
          # artifact-map.json
          if [ -f .github/metadata/artifact-map.json ]; then
            echo "artifact_map<<EOF" >> $GITHUB_ENV
            cat .github/metadata/artifact-map.json >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "::error::artifact-map.json not found"
            exit 1
          fi
          
          # analyzers.json
          if [ -f .github/metadata/analyzers.json ]; then
            echo "analyzers<<EOF" >> $GITHUB_ENV
            cat .github/metadata/analyzers.json >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "::error::analyzers.json not found"
            exit 1
          fi
          
          # environments.yml
          if [ -f .github/metadata/environments.yml ]; then
            echo "environments<<EOF" >> $GITHUB_ENV
            cat .github/metadata/environments.yml >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "::error::environments.yml not found"
            exit 1
          fi
      
      - name: Set up Python virtual environment
        uses: ./.github/actions/setup-venv

      - name: Validate environments.yml schema
        run: |
          echo "### 📋 Validating environments.yml schema" >> $GITHUB_STEP_SUMMARY
          $VENV_PYTHON scripts/validate_environments_yaml.py --path .github/metadata/environments.yml
      
      - name: Build artifact matrix
        id: build
        run: |
          cat > build_matrix.py <<'PYTHON_SCRIPT'
          import json
          import os
          import sys
          import yaml
          
          # Load inputs
          changed_artifacts = json.loads('''${{ inputs.changed_artifacts }}''')
          analyzers_metadata = json.loads('''${{ env.analyzers }}''')
          environments_metadata = yaml.safe_load('''${{ env.environments }}''')
          target_environment = '${{ inputs.target_environment }}'
          
          # Validate environment exists
          if target_environment not in environments_metadata.get('environments', {}):
              print(f"Error: Environment '{target_environment}' not found in environments.yml", file=sys.stderr)
              sys.exit(1)
          
          env_config = environments_metadata['environments'][target_environment]
          workspace_id = env_config.get('workspace_id', '')
          
          if not workspace_id:
              print(f"Info: workspace_id is empty in environments.yml for '{target_environment}'", file=sys.stderr)
              print(f"Info: Workspace ID will be supplied at runtime via FABRIC_WORKSPACE_ID.", file=sys.stderr)
          
          # Build matrix
          matrix_items = []
          artifact_analyzers = analyzers_metadata.get('artifact_analyzers', {})
          
          for artifact in changed_artifacts.get('changed_artifacts', []):
              artifact_name = artifact['name']
              artifact_type = artifact['type']
              artifact_path = artifact['path']
              
              # Get analyzers for this artifact type from artifact_analyzers section
              if artifact_type in artifact_analyzers:
                  analyzer_config = artifact_analyzers[artifact_type]
                  static_analyzers = analyzer_config.get('static', [])
                  dynamic_analyzers = analyzer_config.get('dynamic', [])
                  
                  matrix_item = {
                      'name': artifact_name,
                      'type': artifact_type,
                      'path': artifact_path,
                      'static_analyzers': json.dumps(static_analyzers),
                      'dynamic_analyzers': json.dumps(dynamic_analyzers),
                      'workspace_id': workspace_id,
                      'environment': target_environment
                  }
                  
                  matrix_items.append(matrix_item)
              else:
                  print(f"Warning: No analyzer configuration for artifact type '{artifact_type}'", file=sys.stderr)
          
          # Output matrix
          matrix_output = {'include': matrix_items}
          
          print(f"Built matrix with {len(matrix_items)} artifacts")
          print(json.dumps(matrix_output, indent=2))
          
          # Write outputs
          with open('matrix.json', 'w') as f:
              json.dump(matrix_output, f, indent=2)

          # Preserve changed-artifacts.json for downstream impact discovery
          with open('changed-artifacts.json', 'w') as f:
              json.dump(changed_artifacts, f, indent=2)

          has_playwright_impact = any(
              artifact.get('type') in {'Report', 'SemanticModel'}
              for artifact in changed_artifacts.get('changed_artifacts', [])
          )

          print(f"has_artifacts={'true' if matrix_items else 'false'}")
          print(f"workspace_id={workspace_id}")
          print(f"has_playwright_impact={'true' if has_playwright_impact else 'false'}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'workspace_id={workspace_id}\n')
              f.write(f'has_playwright_impact={"true" if has_playwright_impact else "false"}\n')

          PYTHON_SCRIPT

          $VENV_PYTHON build_matrix.py

          # Read matrix output as single-line JSON to avoid heredoc issues
          MATRIX_JSON=$(jq -c '.' matrix.json)
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

          # Check if we have artifacts
          ARTIFACT_COUNT=$(jq '.include | length' matrix.json)
          if [ "$ARTIFACT_COUNT" -gt 0 ]; then
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
          fi
          
          echo "### 🎯 Artifact Matrix Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifacts to Process**: $ARTIFACT_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Matrix Preview**:" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat matrix.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      - name: Upload matrix artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-matrix
          path: |
            matrix.json
            changed-artifacts.json
          retention-days: 7

      - name: Build deployment plan
        id: build_deploy_plan
        run: |
          cat > build_deploy_plan.py <<'PYTHON_SCRIPT'
          import json
          import os
          import subprocess
          import sys
          import yaml

          changed_artifacts = json.loads('''${{ inputs.changed_artifacts }}''')
          target_environment = '${{ inputs.target_environment }}'

          with open('.github/metadata/environments.yml', encoding='utf-8') as f:
              env_metadata = yaml.safe_load(f) or {}

          workspace_id = (
              env_metadata.get('environments', {})
              .get(target_environment, {})
              .get('workspace_id', '')
          )

          # Compute the deployment plan via deploy.py --plan
          env = os.environ.copy()
          env['GITHUB_WORKSPACE'] = os.getcwd()
          result = subprocess.run(
              [
                  sys.executable,
                  'scripts/deploy.py',
                  '--plan',
                  '--terse',
                  '--environment',
                  target_environment,
              ],
              input=json.dumps(changed_artifacts),
              text=True,
              capture_output=True,
              env=env,
          )
          if result.returncode != 0:
              print(result.stderr, file=sys.stderr)
              sys.exit(result.returncode)

          plan = json.loads(result.stdout)

          # Emit phase matrices as GitHub Actions outputs.
          max_phases = 4
          for phase_idx in range(max_phases):
              if phase_idx < len(plan):
                  artifacts = plan[phase_idx]['artifacts']
                  matrix = {
                      'include': [
                          {
                              'name': a['name'],
                              'type': a['type'],
                              'path': a['path'],
                              'workspace_id': workspace_id,
                              'environment': target_environment,
                          }
                          for a in artifacts
                      ]
                  }
                  has = 'true' if artifacts else 'false'
              else:
                  matrix = {'include': []}
                  has = 'false'

              matrix_path = f'deploy-phase-{phase_idx}-matrix.json'
              with open(matrix_path, 'w') as f:
                  json.dump(matrix, f, indent=2)
              print(f'phase_{phase_idx}_has_artifacts={has}')
              print(f'phase_{phase_idx}_matrix={json.dumps(matrix)}')

              # Also write GitHub output lines
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'phase_{phase_idx}_has_artifacts={has}\n')
                  f.write(f'phase_{phase_idx}_matrix={json.dumps(matrix)}\n')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'phase_count={len(plan)}\n')

          print(f'phase_count={len(plan)}')

          PYTHON_SCRIPT

          $VENV_PYTHON build_deploy_plan.py

          echo "### 🌊 Deployment Plan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Phases**: $(cat "$GITHUB_OUTPUT" | grep '^phase_count=' | cut -d= -f2)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in deploy-phase-*-matrix.json; do
            echo "**$f**:" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat "$f" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload deployment plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-plan
          path: deploy-phase-*-matrix.json
          retention-days: 7

      - name: Build analyzer matrices
        id: build_analyzer_matrices
        run: |
          cat > build_analyzer_matrices.py <<'PYTHON_SCRIPT'
          import json
          import sys
          import yaml

          # Load inputs
          changed_artifacts = json.loads('''${{ inputs.changed_artifacts }}''')
          analyzers_metadata = json.loads('''${{ env.analyzers }}''')
          environments_metadata = yaml.safe_load('''${{ env.environments }}''')
          target_environment = '${{ inputs.target_environment }}'

          env_config = environments_metadata['environments'][target_environment]
          workspace_id = env_config.get('workspace_id', '')

          artifact_analyzers = analyzers_metadata.get('artifact_analyzers', {})

          def build_matrix(analyzer_kind):
              analyzer_items = []
              for artifact in changed_artifacts.get('changed_artifacts', []):
                  artifact_name = artifact['name']
                  artifact_type = artifact['type']
                  artifact_path = artifact['path']

                  if artifact_type in artifact_analyzers:
                      analyzers = artifact_analyzers[artifact_type].get(analyzer_kind, [])
                      for analyzer in analyzers:
                          analyzer_items.append({
                              'artifact_name': artifact_name,
                              'artifact_type': artifact_type,
                              'artifact_path': artifact_path,
                              'analyzer_name': analyzer,
                              'analyzer_type': analyzer_kind,
                              'workspace_id': workspace_id,
                              'environment': target_environment
                          })

              return {'include': analyzer_items}

          static_matrix = build_matrix('static')
          dynamic_matrix_excl_playwright = {
              'include': [
                  item for item in build_matrix('dynamic')['include']
                  if item['analyzer_name'] != 'playwright'
              ]
          }

          # Playwright is handled by a single impact-manifest-driven job rather
          # than a per-artifact matrix, because semantic-model changes can
          # produce dependent reports that are not themselves changed artifacts.

          for name, matrix in (('static', static_matrix), ('dynamic', dynamic_matrix_excl_playwright)):
              path = f'{name}-analyzer-matrix.json'
              with open(path, 'w') as f:
                  json.dump(matrix, f, indent=2)
              print(f"Built {name} analyzer matrix with {len(matrix['include'])} tasks")
              print(json.dumps(matrix, indent=2))
              print(f"has_{name}_analyzers={'true' if matrix['include'] else 'false'}")

          PYTHON_SCRIPT

          $VENV_PYTHON build_analyzer_matrices.py

          # Read matrices and set outputs as single-line JSON to avoid heredoc issues
          for kind in static dynamic; do
            ANALYZER_JSON=$(jq -c '.' "${kind}-analyzer-matrix.json")
            echo "${kind}_analyzer_matrix=$ANALYZER_JSON" >> $GITHUB_OUTPUT

            ANALYZER_COUNT=$(jq '.include | length' "${kind}-analyzer-matrix.json")
            if [ "$ANALYZER_COUNT" -gt 0 ]; then
              echo "has_${kind}_analyzers=true" >> $GITHUB_OUTPUT
            else
              echo "has_${kind}_analyzers=false" >> $GITHUB_OUTPUT
            fi

            ICON=$([ "$kind" == "static" ] && echo "🔬" || echo "🧪")
            echo "### $ICON $(echo "$kind" | sed 's/.*/\u&/') Analyzer Matrix Built" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**$(echo "$kind" | sed 's/.*/\u&/') Analyzer Tasks**: $ANALYZER_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Matrix Preview**:" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat "${kind}-analyzer-matrix.json" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

      - name: Build fab-test matrices
        id: build_fab_test_matrices
        run: |
          cat > build_fab_test_matrices.py <<'PYTHON_SCRIPT'
          import json
          import sys

          changed_artifacts = json.loads('''${{ inputs.changed_artifacts }}''')

          pbir = []
          bpa = []

          for artifact in changed_artifacts.get('changed_artifacts', []):
              artifact_type = artifact['type']
              artifact_name = artifact['name']
              if artifact_type == 'Report':
                  pbir.append({'artifact': artifact_name})
              elif artifact_type == 'SemanticModel':
                  bpa.append({'artifact': artifact_name})

          pbir_matrix = {'include': pbir}
          bpa_matrix = {'include': bpa}

          for name, matrix in (('pbir', pbir_matrix), ('bpa', bpa_matrix)):
              path = f'fab-test-{name}-matrix.json'
              with open(path, 'w') as f:
                  json.dump(matrix, f, indent=2)
              print(f"Built {name} matrix with {len(matrix['include'])} task(s)")
              print(json.dumps(matrix, indent=2))
              print(f"has_{name}={'true' if matrix['include'] else 'false'}")

          PYTHON_SCRIPT

          $VENV_PYTHON build_fab_test_matrices.py

          for kind in pbir bpa; do
            MATRIX_JSON=$(jq -c '.' "fab-test-${kind}-matrix.json")
            echo "${kind}_matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

            COUNT=$(jq '.include | length' "fab-test-${kind}-matrix.json")
            if [ "$COUNT" -gt 0 ]; then
              echo "has_${kind}=true" >> $GITHUB_OUTPUT
            else
              echo "has_${kind}=false" >> $GITHUB_OUTPUT
            fi

            ICON=$([ "$kind" == "pbir" ] && echo "🔬" || echo "🛡️")
            echo "### $kind fab-test Matrix Built" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**$kind Tasks**: $COUNT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Matrix Preview**:" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat "fab-test-${kind}-matrix.json" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload analyzer matrix artifacts
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-matrices
          path: |
            static-analyzer-matrix.json
            dynamic-analyzer-matrix.json
            fab-test-pbir-matrix.json
            fab-test-bpa-matrix.json
          retention-days: 7

      - name: Build package wheel
        id: build_wheel
        run: |
          $VENV_PYTHON -m pip install --quiet build
          $VENV_PYTHON -m build --wheel
          wheel_name=$(basename dist/*.whl)
          echo "wheel_name=$wheel_name" >> $GITHUB_OUTPUT
          echo "### 📦 Package Wheel Built" >> $GITHUB_STEP_SUMMARY
          echo "\`$wheel_name\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload package wheel
        uses: actions/upload-artifact@v4
        with:
          name: package-wheel
          path: dist/*.whl
          retention-days: 7

  static-linux:
    name: PBIR Inspector - ${{ matrix.artifact }}
    needs: [prepare-matrix]
    if: |
      needs.prepare-matrix.outputs.has_pbir == 'true' &&
      inputs.run_static == true
    runs-on: ubuntu-latest

    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.pbir_matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download package wheel
        uses: actions/download-artifact@v4
        with:
          name: package-wheel
          path: dist

      - name: Install package wheel
        run: |
          pip install --quiet dist/*.whl
          echo "### 📦 Installed $(basename dist/*.whl)" >> $GITHUB_STEP_SUMMARY

      - name: Verify fab-test is available
        run: |
          echo "### 🔧 Verifying fab-test installation" >> $GITHUB_STEP_SUMMARY
          fab-test --help

      - name: Run PBIR Inspector via fab-test
        env:
          PBIR_INSPECTOR_PATH: ${{ vars.PBIR_INSPECTOR_PATH }}
          PBIR_INSPECTOR_INSTALL_URL: ${{ vars.PBIR_INSPECTOR_INSTALL_URL }}
          ENABLE_EVENTHOUSE_LOGGING: ${{ inputs.run_telemetry == true && 'true' || 'false' }}
          EVENTHOUSE_URI: ${{ secrets.EVENTHOUSE_URI }}
          EVENTHOUSE_DATABASE: ${{ vars.EVENTHOUSE_DATABASE }}
        run: |
          echo "### 🔍 PBIR Inspector — ${{ matrix.artifact }}" >> $GITHUB_STEP_SUMMARY
          fab-test pbir --artifact "${{ matrix.artifact }}" --format json \
            ${{ inputs.run_telemetry == true && '--telemetry' || '--no-telemetry' }}

      - name: Upload PBIR native output and envelope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbir-${{ matrix.artifact }}-${{ github.run_id }}-${{ strategy.job-index }}
          path: analyzer-results/pbir/${{ matrix.artifact }}/**
          retention-days: 7

  static-windows:
    name: Tabular Editor BPA - ${{ matrix.artifact }}
    needs: [prepare-matrix]
    if: |
      needs.prepare-matrix.outputs.has_bpa == 'true' &&
      inputs.run_static == true
    runs-on: windows-latest

    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.bpa_matrix) }}
      fail-fast: false

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download package wheel
        uses: actions/download-artifact@v4
        with:
          name: package-wheel
          path: dist

      - name: Install package wheel
        run: |
          pip install --quiet dist/*.whl
          echo "### 📦 Installed $(basename dist/*.whl)" >> $GITHUB_STEP_SUMMARY

      - name: Verify fab-test is available
        run: |
          echo "### 🔧 Verifying fab-test installation" >> $GITHUB_STEP_SUMMARY
          fab-test --help

      - name: Run BPA via fab-test
        env:
          TABULAR_EDITOR_PATH: ${{ vars.TABULAR_EDITOR_PATH }}
          TABULAR_EDITOR_INSTALL_URL: ${{ vars.TABULAR_EDITOR_INSTALL_URL }}
          ENABLE_EVENTHOUSE_LOGGING: ${{ inputs.run_telemetry == true && 'true' || 'false' }}
          EVENTHOUSE_URI: ${{ secrets.EVENTHOUSE_URI }}
          EVENTHOUSE_DATABASE: ${{ vars.EVENTHOUSE_DATABASE }}
        run: |
          echo "### 🛡️ Tabular Editor BPA — ${{ matrix.artifact }}" >> $GITHUB_STEP_SUMMARY
          fab-test bpa --artifact "${{ matrix.artifact }}" --format json \
            ${{ inputs.run_telemetry == true && '--telemetry' || '--no-telemetry' }}

      - name: Upload BPA native output and envelope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpa-${{ matrix.artifact }}-${{ github.run_id }}-${{ strategy.job-index }}
          path: analyzer-results/bpa/${{ matrix.artifact }}/**
          retention-days: 7

  # Constraint C7: AI governance validation (disabled)
  ai-governance:
    name: AI Governance Validation
    needs: [prepare-matrix]
    if: false
    uses: ./.github/workflows/ai-governance.yml
    with:
      validation_type: both

  deploy-phase-0:
    name: Deploy Phase 0 - ${{ matrix.name }}
    needs: [prepare-matrix, static-linux, static-windows, ai-governance]
    if: |
      always() &&
      needs.prepare-matrix.outputs.phase_0_has_artifacts == 'true' &&
      (needs.static-linux.result == 'success' || needs.static-linux.result == 'skipped') &&
      (needs.static-windows.result == 'success' || needs.static-windows.result == 'skipped') &&
      (needs.ai-governance.result == 'success' || needs.ai-governance.result == 'skipped')
    runs-on: ubuntu-latest

    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.phase_0_matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python virtual environment
        uses: ./.github/actions/setup-venv

      - name: Deploy artifact
        env:
          FABRIC_WORKSPACE_ID: ${{ matrix.workspace_id }}
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          FABRIC_SERVICE_PRINCIPAL_ID: ${{ secrets.FABRIC_SERVICE_PRINCIPAL_ID }}
          FABRIC_SERVICE_PRINCIPAL_SECRET: ${{ secrets.FABRIC_SERVICE_PRINCIPAL_SECRET }}
        run: |
          echo "### 🚀 Deploying ${{ matrix.name }} to ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact Details**:" >> $GITHUB_STEP_SUMMARY
          echo "- Name: ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Type: ${{ matrix.type }}" >> $GITHUB_STEP_SUMMARY
          echo "- Path: ${{ matrix.path }}" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Phase: 0" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Command** (Constraint C2):" >> $GITHUB_STEP_SUMMARY
