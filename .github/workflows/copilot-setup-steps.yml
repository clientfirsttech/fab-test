name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install root dependencies
              run: npm ci

            - name: Verify repository baseline files
              run: |
                  test -f vision.md
                  test -f plan.md
                  test -f README.md

            - name: Verify baseline works without RTK
              env:
                  DISABLE_RTK: "1"
              run: |
                  git status
                  python --version
                  python scripts/rtk_hook_guard.py
                  test -f .github/hooks/rtk-rewrite.json

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Python dependencies
              run: pip install pyyaml

            - name: Validate environments.yml schema
              run: python scripts/validate_environments_schema.py --terse
