name: "Copilot Setup Steps"

# What GitHub Copilot's coding agent runs before it starts, so the agent
# begins with dependencies installed rather than discovering them.
#
# This arrived from a JS/TS template and every step after the checkout was
# wrong for this project: `npm ci` with no package.json anywhere in the tree
# (which failed on every run), Node and Bun toolchains nothing here uses,
# two scripts under a top-level `scripts/` directory that does not exist, and
# Python 3.11 against a `requires-python = ">=3.12"` project. A setup that
# errors is worse than no setup, because the agent inherits it.
#
# Runs on changes to itself so it can be validated the same way, and on
# demand from the Actions tab. Asserted by tests/test_workflow_triggers.py.
on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    # The job MUST be called `copilot-setup-steps` or Copilot will not pick it up.
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # Matches build.yml. The agent and CI disagreeing about the
            # interpreter is a class of bug that only shows up in one of them.
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            # The whole point: editable install plus the dev extra, so ruff and
            # pytest are present and the console scripts are on PATH. Several
            # contract tests launch `fab-test` as a subprocess and cannot pass
            # without that.
            - name: Install the package and its dev tools
              run: pip install -e ".[dev]"

            - name: Verify the agent's baseline documents are present
              run: |
                  test -f vision.md
                  test -f plan.md
                  test -f README.md
                  test -f CLAUDE.md
                  test -f .github/copilot-instructions.md

            - name: Verify the console scripts resolve
              run: |
                  fab-test --version
                  fab-test doctor --analyzer bpa || true

            - name: Verify the toolchain the agent will be asked to run
              run: |
                  ruff --version
                  pytest --version
                  ruff check .

            # .github/hooks/rtk-rewrite.json calls `rtk hook copilot` on every
            # Bash tool call. Without rtk actually present, that hook used to
            # deny every tool call in the session outright -- fixed short-term
            # by deleting the hook, but that also gave up rtk's token savings
            # for every Copilot session. Installing it here restores them
            # (RTK Cloud Agent Blocking epic). The hook itself still fails
            # open if this step is skipped or errors, so a broken install
            # degrades to "no rewriting," never to a blocked session.
            - name: Install rtk (token-optimizing CLI hook)
              run: |
                  curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"

            - name: Verify rtk is on PATH
              run: rtk --version
