name: Publish to TestPyPI

# The rehearsal target. Two ways in:
#
#   workflow_dispatch  -- rehearse without moving a tag. A tag is a claim about
#                         a commit; needing to move one to retry a release is
#                         how a tag ends up describing the wrong tree.
#   a pre-release tag  -- v1.0.0.0.dev1, v1.0.1rc2, and so on. These are the
#                         tags production refuses.
#
# A final tag reaches publish.yml, not here.
on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*.dev[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+*[ab][0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+*rc[0-9]+"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/fab-test
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build packaging

      - name: Build wheel and sdist
        run: python -m build

      - name: Check wheel contents
        run: python .github/scripts/check_wheel_contents.py

      # Renders README as the index will render it and fails on anything
      # PyPI would reject. --strict promotes warnings to errors: a warning
      # here is discovered at upload, which is after the version is spent.
      - name: Check distribution metadata renders
        run: |
          pip install twine
          twine check --strict dist/*

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI keeps every rehearsal and refuses a repeat upload of a
          # version. Re-running a dispatch on an unchanged tree is a normal
          # thing to do, and it should not fail the job.
          skip-existing: true

      # Verifying the upload is the point of a rehearsal: the wheel that
      # builds here is not proof that the wheel an index serves installs.
      # TestPyPI carries none of our dependencies at the pinned versions
      # (pql-test 0.1.11 there vs the 0.1.12 we require), so the extra index
      # is not optional -- it is what makes the install resolvable at all.
      - name: Install from TestPyPI and run the console script
        run: |
          set -e
          VERSION="$(python .github/scripts/check_release_target.py --print-version)"
          python -m venv /tmp/verify
          for attempt in 1 2 3 4 5 6; do
            if /tmp/verify/bin/pip install \
                 --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple \
                 "fab-test==${VERSION}"; then
              break
            fi
            echo "index has not caught up yet; retrying in 20s (attempt ${attempt}/6)"
            sleep 20
          done
          /tmp/verify/bin/fab-test --version
          /tmp/verify/bin/fab-test doctor --analyzer bpa || true
          /tmp/verify/bin/fab-test config --show
