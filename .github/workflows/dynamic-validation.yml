name: Dynamic Validation

on:
  workflow_run:
    workflows:
      - Orchestrator
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Prepare Dynamic Validation Matrix
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_artifacts: ${{ steps.matrix.outputs.has_artifacts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python virtual environment
        uses: ./.github/actions/setup-venv

      - name: Download artifact matrix from triggering run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: artifact-matrix
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: downloaded-matrix

      - name: Build pql_test matrix
        id: matrix
        run: |
          cat > build_pql_matrix.py <<'PYTHON_SCRIPT'
          import json
          import os

          def _fallback_env():
              """Default environment when there is no triggering orchestrator run."""
              branch = os.environ.get("GITHUB_REF_NAME", "")
              if branch == "main":
                  return "prod"
              if branch == "develop":
                  return "dev"
              return "dev"

          matrix_path = "downloaded-matrix/matrix.json"
          if not os.path.exists(matrix_path):
              # workflow_dispatch fallback: discover all SemanticModel artifacts
              env = _fallback_env()
              artifacts_root = ".fabric/artifacts"
              if os.path.isdir(artifacts_root):
                  artifacts = [
                      {
                          "name": p,
                          "type": "SemanticModel",
                          "path": os.path.join(artifacts_root, p),
                          "environment": env,
                          "workspace_id": "",
                      }
                      for p in os.listdir(artifacts_root)
                      if p.endswith(".SemanticModel") and os.path.isdir(os.path.join(artifacts_root, p))
                  ]
              else:
                  artifacts = []
          else:
              with open(matrix_path) as f:
                  data = json.load(f)
              artifacts = [
                  {
                      "name": item["name"],
                      "type": item["type"],
                      "path": item["path"],
                      "environment": item.get("environment", ""),
                      "workspace_id": item.get("workspace_id", ""),
                  }
                  for item in data.get("include", [])
                  if item.get("type") == "SemanticModel"
              ]

          items = [
              {
                  "artifact": a["name"],
                  "path": a["path"],
                  "environment": a.get("environment", ""),
                  "workspace_id": a.get("workspace_id", ""),
              }
              for a in artifacts
          ]
          matrix = {"include": items}

          with open("pql-test-matrix.json", "w") as f:
              json.dump(matrix, f, indent=2)

          print(json.dumps(matrix, indent=2))
          print(f"has_artifacts={'true' if items else 'false'}")
          print(f"matrix={json.dumps(matrix)}")  # single-line for GitHub output
          PYTHON_SCRIPT

          $VENV_PYTHON build_pql_matrix.py >> $GITHUB_OUTPUT

      - name: Upload pql-test matrix artifact
        uses: actions/upload-artifact@v4
        with:
          name: pql-test-matrix
          path: pql-test-matrix.json
          retention-days: 7

  pql-test:
    name: pql-test - ${{ matrix.artifact }}
    needs: [prepare]
    if: needs.prepare.outputs.has_artifacts == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python virtual environment
        uses: ./.github/actions/setup-venv

      - name: Check Fabric credentials
        id: credentials
        run: |
          if [ -z "${{ secrets.FABRIC_SERVICE_PRINCIPAL_ID }}" ] || [ -z "${{ secrets.FABRIC_SERVICE_PRINCIPAL_SECRET }}" ] || [ -z "${{ secrets.FABRIC_TENANT_ID }}" ]; then
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "::warning::Fabric service principal credentials are missing; skipping pql_test."
          else
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          fi

      - name: Run pql-test via fab-test
        if: steps.credentials.outputs.has_credentials == 'true'
        env:
          FABRIC_SERVICE_PRINCIPAL_ID: ${{ secrets.FABRIC_SERVICE_PRINCIPAL_ID }}
          FABRIC_SERVICE_PRINCIPAL_SECRET: ${{ secrets.FABRIC_SERVICE_PRINCIPAL_SECRET }}
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          FABRIC_ENVIRONMENT: ${{ matrix.environment }}
          FABRIC_WORKSPACE_ID: ${{ matrix.workspace_id }}
          ENABLE_EVENTHOUSE_LOGGING: ${{ vars.ENABLE_EVENTHOUSE_LOGGING || 'false' }}
          EVENTHOUSE_URI: ${{ secrets.EVENTHOUSE_URI }}
          EVENTHOUSE_DATABASE: ${{ vars.EVENTHOUSE_DATABASE }}
        run: |
          echo "### 🧪 pql-test — ${{ matrix.artifact }} (${{ matrix.environment }})" >> $GITHUB_STEP_SUMMARY
          fab-test pql_test \
            --artifact "${{ matrix.artifact }}" \
            --env "${{ matrix.environment }}" \
            --workspace-id "${{ matrix.workspace_id }}" \
            --format json \
            ${{ (vars.ENABLE_EVENTHOUSE_LOGGING || 'false') == 'true' && '--telemetry' || '--no-telemetry' }}

      - name: Upload pql-test native output and envelope
        if: always() && steps.credentials.outputs.has_credentials == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pql-test-${{ matrix.artifact }}-${{ github.run_id }}-${{ strategy.job-index }}
          path: analyzer-results/pql_test/${{ matrix.artifact }}/**
          retention-days: 7

      - name: Skip pql-test without credentials
        if: steps.credentials.outputs.has_credentials == 'false'
        run: |
          echo "::notice::Skipped pql_test for ${{ matrix.artifact }} due to missing credentials."
