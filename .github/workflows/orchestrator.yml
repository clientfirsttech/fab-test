name: Orchestrator

# Gated deliberately. This repository publishes the `fab-test` CLI; the Fabric
# artifact pipeline needs a `.fabric/artifacts` layout, a workspace, and
# service-principal credentials it has no reason to hold. Running on every
# pull request to main produced a red check nobody could act on, which buried
# the one result that mattered -- whether the package builds and its tests
# pass. Still fully invocable below; nothing starts it on its own.
# Asserted by tests/test_workflow_triggers.py.
on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target environment for deployment'
        required: true
        default: 'testbed'
        type: choice
        options:
          - testbed
          - dev
          - test
          - prod
      enable_telemetry:
        description: 'Enable Eventhouse telemetry logging'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  BRANCH_ENVIRONMENT_CONFIG: '.github/metadata/environments.yml'

jobs:
  branch-environment-guard:
    name: Branch / Environment Guard
    runs-on: ubuntu-latest
    outputs:
      target_environment: ${{ steps.resolve.outputs.target_environment }}
      is_prod_allowed: ${{ steps.resolve.outputs.is_prod_allowed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve allowed environment for branch
        id: resolve
        run: |
          BRANCH="${{ github.ref_name }}"
          EVENT="${{ github.event_name }}"
          INPUT_ENV="${{ inputs.target_environment }}"

          echo "Branch: $BRANCH"
          echo "Event: $EVENT"
          echo "Requested environment: ${INPUT_ENV:-<not set>}"

          # Default branch-independent behaviour: non-main branches deploy to testbed/dev/test only.
          if [ "$BRANCH" = "main" ]; then
            if [ "$EVENT" = "push" ] || [ "$EVENT" = "pull_request" ]; then
              echo "::error::main branch is production-only. Pushes and PRs to main do not auto-deploy. Use workflow_dispatch on main to target prod, or merge through develop/test/release branches."
              exit 1
            fi
            # workflow_dispatch on main may target prod (default) or test/testbed for verification.
            DEFAULT_ENV="prod"
            ALLOWED_ENVS="testbed dev test prod"
            IS_PROD_ALLOWED="true"
          else
            # Non-main branches may only target non-production environments.
            # Testbed deployments are reserved for the testbed branch, feature/**, and release/**.
            DEFAULT_ENV="dev"
            if [ "$BRANCH" = "testbed" ] || [[ "$BRANCH" == feature/* ]] || [[ "$BRANCH" == release/* ]]; then
              ALLOWED_ENVS="testbed dev test"
            else
              ALLOWED_ENVS="dev test"
            fi
            IS_PROD_ALLOWED="false"
          fi

          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_ENV" ]; then
            TARGET_ENV="$INPUT_ENV"
          else
            TARGET_ENV="$DEFAULT_ENV"
          fi

          if ! echo "$ALLOWED_ENVS" | grep -qw "$TARGET_ENV"; then
            echo "::error::Environment '$TARGET_ENV' is not allowed from branch '$BRANCH'. Allowed environments: $ALLOWED_ENVS."
            exit 1
          fi

          if [ "$TARGET_ENV" = "prod" ] && [ "$IS_PROD_ALLOWED" != "true" ]; then
            echo "::error::Production deployments are only allowed from the main branch via workflow_dispatch."
            exit 1
          fi

          echo "target_environment=$TARGET_ENV" >> $GITHUB_OUTPUT
          echo "is_prod_allowed=$IS_PROD_ALLOWED" >> $GITHUB_OUTPUT
          echo "### 🛡️ Branch / Environment Guard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: $BRANCH" >> $GITHUB_STEP_SUMMARY
          echo "- **Event**: $EVENT" >> $GITHUB_STEP_SUMMARY
          echo "- **Target environment**: $TARGET_ENV" >> $GITHUB_STEP_SUMMARY
          echo "- **Production allowed**: $IS_PROD_ALLOWED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Environment selection is metadata-driven via $BRANCH_ENVIRONMENT_CONFIG. Branch name does not determine workspace." >> $GITHUB_STEP_SUMMARY

  detect-changes:
    name: Detect Changes
    needs: branch-environment-guard
    uses: ./.github/workflows/detect-changes.yml

  run-pipeline:
    name: Run CI/CD Pipeline
    needs: [branch-environment-guard, detect-changes]
    if: needs.detect-changes.outputs.has_changes == 'true'
    uses: ./.github/workflows/artifact-runner.yml
    secrets: inherit
    with:
      changed_artifacts: ${{ needs.detect-changes.outputs.artifacts_changed }}
      target_environment: ${{ needs.branch-environment-guard.outputs.target_environment }}
      run_static: true
      run_dynamic: true
      run_telemetry: ${{ inputs.enable_telemetry || false }}

  constraint-summary:
    name: Constraint Enforcement Summary
    runs-on: ubuntu-latest
    needs: [branch-environment-guard, detect-changes, run-pipeline]
    if: always() && needs.detect-changes.outputs.has_changes == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download changed artifacts
        uses: actions/download-artifact@v4
        with:
          name: changed-artifacts

      - name: Generate constraint enforcement summary
        run: |
          echo "# 🚦 Constraint Enforcement Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Pipeline Constraints" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ C3: Static analysis runs before deployment" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ C4: Dynamic validation runs after deployment" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ C7: AI-generated changes must pass validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Artifact-Specific Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          jq -r '
            .changed_artifacts[] |
            "- **\(.name)** (\(.type)): " + (
              if .type == "SemanticModel" then
                "PQLint + Tabular Editor BPA (static), PQL.Assert (dynamic)"
              elif .type == "Report" then
                "PBIR Inspector (static), PBIR Inspector + Playwright (dynamic)"
              elif .type == "Agent" then
                "Prompt Lint (static), Prompt Eval (dynamic)"
              else
                "No configured analyzers"
              end
            )
          ' changed-artifacts.json >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Analyzers are driven by \`.github/metadata/analyzers.json\`." >> $GITHUB_STEP_SUMMARY

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [
      branch-environment-guard,
      detect-changes,
      run-pipeline,
      constraint-summary
    ]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "# 🎯 Fabric Artifact CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Detect Changes
          if [ "${{ needs.detect-changes.result }}" == "success" ]; then
            echo "✅ **Change Detection**: Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Change Detection**: ${{ needs.detect-changes.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Branch / Environment Guard
          if [ "${{ needs.branch-environment-guard.result }}" == "success" ]; then
            echo "✅ **Branch / Environment Guard**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Branch / Environment Guard**: ${{ needs.branch-environment-guard.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          # Pipeline Execution
          if [ "${{ needs.run-pipeline.result }}" == "success" ]; then
            echo "✅ **Pipeline Execution**: Success" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.run-pipeline.result }}" == "skipped" ]; then
            echo "⏭️  **Pipeline Execution**: Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Pipeline Execution**: ${{ needs.run-pipeline.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Constraint Enforcement" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ C3: Static validation before deployment" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ C4: Dynamic validation after deployment" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ C5: SemanticModel validation (PQLint + PQL.Assert)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ C6: Report validation (PBIR Inspector + Playwright)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ C7: AI governance controls" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Pipeline Architecture" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. **Detect Changes** → identify changed artifacts" >> $GITHUB_STEP_SUMMARY
          echo "2. **Static Analysis** → pre-deployment validation (fail-fast)" >> $GITHUB_STEP_SUMMARY
          echo "3. **Deploy** → Fabric CI/CD Python (only permitted provider)" >> $GITHUB_STEP_SUMMARY
          echo "4. **Dynamic Validation** → post-deployment verification (blocks promotion)" >> $GITHUB_STEP_SUMMARY
          echo "5. **Telemetry** → optional Eventhouse logging" >> $GITHUB_STEP_SUMMARY
