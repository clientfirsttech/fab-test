name: Reusable Eventhouse Telemetry

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
        description: Name of the artifact
      artifact_type:
        required: true
        type: string
        description: Type of the artifact (SemanticModel, Report, Agent, etc)
      analysis_type:
        required: true
        type: string
        description: Type of analysis (static, dynamic, deployment, testbed)
      results:
        required: true
        type: string
        description: JSON results to log
      commit_sha:
        required: true
        type: string
        description: Git commit SHA
      environment:
        required: false
        type: string
        default: ""
        description: Target environment
    secrets:
      EVENTHOUSE_CONNECTION:
        required: false
        description: Eventhouse connection string

permissions:
  contents: read

jobs:
  log-telemetry:
    name: Log Telemetry - ${{ inputs.artifact_name }}
    runs-on: ubuntu-latest
    
    # Only run if ENABLE_EVENTHOUSE_LOGGING is enabled
    if: vars.ENABLE_EVENTHOUSE_LOGGING == 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python virtual environment
        uses: ./.github/actions/setup-venv
      
      - name: Validate feature flag
        id: validate
        run: |
          echo "### 📊 Eventhouse Telemetry Logging" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ vars.ENABLE_EVENTHOUSE_LOGGING }}" == "true" ]; then
            echo "✅ **Feature Flag**: Enabled" >> $GITHUB_STEP_SUMMARY
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ **Feature Flag**: Disabled - Skipping telemetry" >> $GITHUB_STEP_SUMMARY
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Telemetry Details**:" >> $GITHUB_STEP_SUMMARY
          echo "- Artifact: ${{ inputs.artifact_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Type: ${{ inputs.artifact_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- Analysis: ${{ inputs.analysis_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ inputs.commit_sha }}" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "${{ inputs.environment }}" ]; then
            echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Determine target table
        id: table
        if: steps.validate.outputs.enabled == 'true'
        run: |
          TABLE_NAME=""
          
          case "${{ inputs.analysis_type }}" in
            "static")
              TABLE_NAME="fabric_static_analysis"
              ;;
            "dynamic")
              TABLE_NAME="fabric_dynamic_analysis"
              ;;
            "deployment")
              TABLE_NAME="fabric_deployments"
              ;;
            "testbed")
              TABLE_NAME="fabric_testbed_runs"
              ;;
            *)
              echo "::error::Unknown analysis type: ${{ inputs.analysis_type }}"
              exit 1
              ;;
          esac
          
          echo "table_name=$TABLE_NAME" >> $GITHUB_OUTPUT
          echo "- **Target Table**: $TABLE_NAME" >> $GITHUB_STEP_SUMMARY
      
      - name: Prepare telemetry payload
        id: payload
        if: steps.validate.outputs.enabled == 'true'
        run: |
          # Build telemetry record
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          cat > telemetry.json <<EOF
          {
            "timestamp": "$TIMESTAMP",
            "artifact_name": "${{ inputs.artifact_name }}",
            "artifact_type": "${{ inputs.artifact_type }}",
            "analysis_type": "${{ inputs.analysis_type }}",
            "commit_sha": "${{ inputs.commit_sha }}",
            "environment": "${{ inputs.environment }}",
            "results": ${{ inputs.results }},
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_number": "${{ github.run_number }}",
            "repository": "${{ github.repository }}",
            "actor": "${{ github.actor }}"
          }
          EOF
          
          echo "payload_file=telemetry.json" >> $GITHUB_OUTPUT
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Payload Preview**:" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat telemetry.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      - name: Install Eventhouse logger
        if: steps.validate.outputs.enabled == 'true'
        run: |
          echo "### 📦 Installing Eventhouse Logger" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: eventhouse_logger.py placeholder - implementation pending" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Installation will include**:" >> $GITHUB_STEP_SUMMARY
          echo "- Kusto Python SDK" >> $GITHUB_STEP_SUMMARY
          echo "- Azure Identity libraries" >> $GITHUB_STEP_SUMMARY
          echo "- Telemetry schema validation" >> $GITHUB_STEP_SUMMARY
      
      - name: Publish to Eventhouse
        if: steps.validate.outputs.enabled == 'true'
        continue-on-error: true  # Per C9: telemetry failures never block workflows
        env:
          ENABLE_EVENTHOUSE_LOGGING: ${{ vars.ENABLE_EVENTHOUSE_LOGGING }}
        run: |
          echo "### 📤 Publishing Telemetry to Eventhouse" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Execute Eventhouse logger
          $VENV_PYTHON scripts/eventhouse_logger.py \
            --table "${{ steps.table.outputs.table_name }}" \
            --payload telemetry.json
          
          LOGGER_EXIT_CODE=$?
          
          if [ $LOGGER_EXIT_CODE -eq 0 ]; then
            echo "✅ **Publishing Status**: Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Publishing Status**: Failed (continuing per Constraint C9)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Schema Reference**:" >> $GITHUB_STEP_SUMMARY
          echo "- Source: https://github.com/kerski/pbi-teams-more-analytic-support (Eventhouse branch)" >> $GITHUB_STEP_SUMMARY
          echo "- Pattern: Eventhouse schema is system of record per Constraint C9" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload telemetry artifact
        if: steps.validate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-${{ inputs.artifact_name }}-${{ inputs.analysis_type }}
          path: telemetry.json
          retention-days: 30
      
      - name: Handle logging failure
        if: failure() && steps.validate.outputs.enabled == 'true'
        run: |
          echo "::warning::Eventhouse telemetry logging failed. Per Constraint C9, telemetry is optional and never mandatory."
          echo "Workflow continues despite telemetry failure."
