name: Security Scanning

on:
  workflow_call:
    inputs:
      changed_files:
        required: false
        type: string
        default: ''
        description: JSON array of changed file paths to scan
    outputs:
      scan_passed:
        description: Whether security scan passed
        value: ${{ jobs.security-scan.outputs.scan_passed }}
      findings:
        description: JSON array of security findings
        value: ${{ jobs.security-scan.outputs.findings }}

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    outputs:
      scan_passed: ${{ steps.aggregate.outputs.scan_passed }}
      findings: ${{ steps.aggregate.outputs.findings }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scanning
      
      - name: Set up Python virtual environment
        uses: ./.github/actions/setup-venv
        with:
          install-requirements: 'true'
      
      - name: Record virtual environment paths
        run: |
          source .venv/bin/activate
          echo "VENV_PYTHON=$(which python)" >> $GITHUB_ENV
          echo "VENV_BIN=$(dirname $(which python))" >> $GITHUB_ENV
      
      - name: Secret scanning
        id: secret_scan
        continue-on-error: true
        run: |
          echo "🔍 Running secret scanning" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Initialize detect-secrets baseline if it doesn't exist
          if [ ! -f .secrets.baseline ]; then
            $VENV_BIN/detect-secrets scan --baseline .secrets.baseline
          fi
          
          # Scan for secrets
          $VENV_BIN/detect-secrets scan --baseline .secrets.baseline > secret-scan-results.json 2>&1 || true
          
          # Check for new secrets
          if $VENV_BIN/detect-secrets audit .secrets.baseline --report --json > secret-findings.json 2>&1; then
            SECRET_COUNT=$(jq '.results | length' secret-findings.json 2>/dev/null || echo "0")
            
            if [ "$SECRET_COUNT" -gt 0 ]; then
              echo "❌ Found $SECRET_COUNT potential secrets" >> $GITHUB_STEP_SUMMARY
              jq -r '.results[] | "- \(.filename):\(.line_number) - \(.type)"' secret-findings.json >> $GITHUB_STEP_SUMMARY || true
              echo "secret_scan_passed=false" >> $GITHUB_OUTPUT
            else
              echo "✅ Secret scan: No secrets detected" >> $GITHUB_STEP_SUMMARY
              echo "secret_scan_passed=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️  Secret scan completed with warnings" >> $GITHUB_STEP_SUMMARY
            echo "secret_scan_passed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Entropy detection
        id: entropy_scan
        continue-on-error: true
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔍 Running entropy detection" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Scan for high-entropy strings (potential secrets)
          $VENV_PYTHON scripts/scan_entropy.py | tee entropy-findings.json
          
          ENTROPY_COUNT=$(jq '.count' entropy-findings.json)
          
          if [ "$ENTROPY_COUNT" -gt 0 ]; then
            echo "⚠️  Found $ENTROPY_COUNT high-entropy strings" >> $GITHUB_STEP_SUMMARY
            echo "Review these for potential secrets:" >> $GITHUB_STEP_SUMMARY
            jq -r '.findings[] | "- \(.file):\(.line) (entropy: \(.entropy))"' entropy-findings.json | head -20 >> $GITHUB_STEP_SUMMARY
            echo "entropy_scan_passed=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Entropy scan: No high-entropy strings detected" >> $GITHUB_STEP_SUMMARY
            echo "entropy_scan_passed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Credential pattern validation
        id: credential_scan
        continue-on-error: true
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔍 Running credential pattern validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Scan for common credential patterns
          $VENV_PYTHON scripts/scan_credentials.py | tee credential-findings.json
          
          CREDENTIAL_COUNT=$(jq '.count' credential-findings.json)
          
          if [ "$CREDENTIAL_COUNT" -gt 0 ]; then
            echo "❌ Found $CREDENTIAL_COUNT potential credentials" >> $GITHUB_STEP_SUMMARY
            echo "Review these immediately:" >> $GITHUB_STEP_SUMMARY
            jq -r '.findings[] | "- \(.file):\(.line) - \(.pattern)"' credential-findings.json | head -20 >> $GITHUB_STEP_SUMMARY
            echo "credential_scan_passed=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Credential scan: No credentials detected" >> $GITHUB_STEP_SUMMARY
            echo "credential_scan_passed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Aggregate security results
        id: aggregate
        if: always()
        run: |
          # Combine all findings
          $VENV_PYTHON scripts/aggregate_security_findings.py

          # Read aggregated findings
          FINDING_COUNT=$(jq '.count' security-findings.json)
          
          # Determine if scan passed
          SECRET_PASSED="${{ steps.secret_scan.outputs.secret_scan_passed }}"
          ENTROPY_PASSED="${{ steps.entropy_scan.outputs.entropy_scan_passed }}"
          CREDENTIAL_PASSED="${{ steps.credential_scan.outputs.credential_scan_passed }}"
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$FINDING_COUNT" -eq 0 ]; then
            echo "scan_passed=true" >> $GITHUB_OUTPUT
            echo "✅ **Security Scan Result**: PASSED (0 findings)" >> $GITHUB_STEP_SUMMARY
          else
            echo "scan_passed=false" >> $GITHUB_OUTPUT
            echo "❌ **Security Scan Result**: FAILED ($FINDING_COUNT findings)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Action Required**: Review and remediate security findings before proceeding." >> $GITHUB_STEP_SUMMARY
          fi
          
          # Export findings for downstream use (output as compact single-line JSON)
          FINDINGS=$(jq -c . security-findings.json)
          echo "findings=$FINDINGS" >> $GITHUB_OUTPUT
      
      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            security-findings.json
            secret-findings.json
            entropy-findings.json
            credential-findings.json
          retention-days: 90
      
      - name: Block on security findings (Constraint C1)
        if: steps.aggregate.outputs.scan_passed != 'true'
        run: |
          echo "::error::Security scan failed. Found potential secrets, high-entropy strings, or credential patterns. Pipeline blocked per Constraint C1."
          exit 1
