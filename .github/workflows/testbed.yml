name: TestBed Validation

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
        description: Name of the artifact to validate
      artifact_type:
        required: true
        type: string
        description: Type of the artifact (SemanticModel, Report, Agent, etc)
      artifact_path:
        required: true
        type: string
        description: Path to the artifact directory
    outputs:
      validation_passed:
        description: Whether test bed validation passed
        value: ${{ jobs.testbed-validation.outputs.validation_passed }}
      baseline_comparison:
        description: JSON results from baseline comparison
        value: ${{ jobs.testbed-validation.outputs.baseline_comparison }}

permissions:
  contents: read

jobs:
  testbed-validation:
    name: TestBed - ${{ inputs.artifact_name }}
    runs-on: ubuntu-latest

    outputs:
      validation_passed: ${{ steps.aggregate.outputs.validation_passed }}
      baseline_comparison: ${{ steps.compare.outputs.baseline_comparison }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python virtual environment
        uses: ./.github/actions/setup-venv

      - name: Load TestBed configuration
        id: config
        run: |
          echo "### 🧪 TestBed Validation - ${{ inputs.artifact_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact**: ${{ inputs.artifact_path }}" >> $GITHUB_STEP_SUMMARY
          echo "**Type**: ${{ inputs.artifact_type }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Load testbed workspace from unified environments.yml (use venv python)
          WORKSPACE_ID=$($VENV_PYTHON -c "import yaml; print(yaml.safe_load(open('.github/metadata/environments.yml'))['environments']['testbed']['workspace_id'])")
          
          echo "workspace_id=$WORKSPACE_ID" >> $GITHUB_OUTPUT
          echo "**TestBed Workspace**: $WORKSPACE_ID" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Clone artifact for testbed
        id: clone
        uses: ./.github/actions/testbed-clone
        with:
          artifact_name: ${{ inputs.artifact_name }}
          artifact_path: ${{ inputs.artifact_path }}

      - name: Deploy to TestBed workspace
        id: deploy
        uses: ./.github/actions/testbed-deploy
        with:
          test_artifact_path: ${{ steps.clone.outputs.test_artifact_path }}
          workspace_id: ${{ steps.config.outputs.workspace_id }}
          fabric_tenant_id: ${{ secrets.FABRIC_TENANT_ID }}
          fabric_service_principal_id: ${{ secrets.FABRIC_SERVICE_PRINCIPAL_ID }}
          fabric_service_principal_secret: ${{ secrets.FABRIC_SERVICE_PRINCIPAL_SECRET }}

      - name: Run TestBed validation suite
        id: validate
        if: steps.deploy.outputs.deployment_success == 'true'
        continue-on-error: true
        uses: ./.github/actions/testbed-validate
        with:
          artifact_type: ${{ inputs.artifact_type }}
          test_artifact_name: ${{ steps.clone.outputs.test_artifact_name }}
          workspace_id: ${{ steps.config.outputs.workspace_id }}

      - name: Compare against baseline
        id: compare
        if: steps.validate.outputs.validation_passed == 'true'
        continue-on-error: true
        uses: ./.github/actions/testbed-compare-baseline
        with:
          artifact_name: ${{ inputs.artifact_name }}
          artifact_type: ${{ inputs.artifact_type }}
          test_artifact_name: ${{ steps.clone.outputs.test_artifact_name }}
          workspace_id: ${{ steps.config.outputs.workspace_id }}

      - name: Cleanup test artifacts
        if: always()
        uses: ./.github/actions/testbed-cleanup
        with:
          test_artifact_name: ${{ steps.clone.outputs.test_artifact_name }}
          test_artifact_path: ${{ steps.clone.outputs.test_artifact_path }}

      - name: Aggregate results
        id: aggregate
        if: always()
        run: |
          if [ "${{ steps.deploy.outputs.deployment_success }}" == "true" ] && \
             [ "${{ steps.validate.outputs.validation_passed }}" == "true" ]; then
            echo "validation_passed=true" >> $GITHUB_OUTPUT
            echo "✅ **Overall TestBed Result**: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "validation_passed=false" >> $GITHUB_OUTPUT
            echo "❌ **Overall TestBed Result**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload TestBed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbed-results-${{ inputs.artifact_name }}
          path: |
            baseline-comparison.json
          retention-days: 30

      - name: Block promotion on failure
        if: steps.aggregate.outputs.validation_passed != 'true'
        run: |
          echo "::error::TestBed validation failed for ${{ inputs.artifact_name }}. Promotion to Dev blocked per Constraint C8."
          exit 1
