name: SPIKE - ADOMD.NET on Linux
on:
  workflow_dispatch:

jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pythonnet
      - name: Try loading net8.0 ADOMD.NET assembly under pythonnet on Linux
        run: |
          python - <<'PY'
          import os
          import sys
          import urllib.request
          import zipfile

          url = (
              "https://api.nuget.org/v3-flatcontainer/"
              "microsoft.analysisservices.adomdclient/19.114.0/"
              "microsoft.analysisservices.adomdclient.19.114.0.nupkg"
          )
          nupkg = "/tmp/adomd.nupkg"
          extract_dir = "/tmp/adomd_net8"
          urllib.request.urlretrieve(url, nupkg)
          prefix = "lib/net8.0/"
          with zipfile.ZipFile(nupkg) as z:
              for member in z.namelist():
                  if not member.startswith(prefix) or member.endswith("/"):
                      continue
                  rel = member[len(prefix):]
                  dest = os.path.join(extract_dir, *rel.split("/"))
                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  with z.open(member) as src, open(dest, "wb") as out:
                      out.write(src.read())
          print("Extracted to", extract_dir, "-", os.listdir(extract_dir))

          sys.path.append(extract_dir)
          import clr  # noqa: E402

          clr.AddReference("Microsoft.AnalysisServices.AdomdClient")
          from Microsoft.AnalysisServices.AdomdClient import AdomdConnection  # noqa: E402
          from System.Reflection import Assembly  # noqa: E402

          asm = Assembly.GetAssembly(AdomdConnection)
          print(f"LOADED OK: {asm.Location} (version {asm.GetName().Version})")

          # Confirm we can actually instantiate the connection object (no
          # network call yet -- just proves the CLR type is usable, not a
          # stub that throws on first touch).
          conn = AdomdConnection()
          print("AdomdConnection instantiated:", conn)
          PY
