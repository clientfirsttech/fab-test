name: Detect Changes

# Gated deliberately. This repository publishes the `fab-test` CLI; the Fabric
# artifact pipeline needs a `.fabric/artifacts` layout, a workspace, and
# service-principal credentials it has no reason to hold. Running on every
# pull request to main produced a red check nobody could act on, which buried
# the one result that mattered -- whether the package builds and its tests
# pass. Still fully invocable below; nothing starts it on its own.
# Asserted by tests/test_workflow_triggers.py.
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      has_changes:
        description: 'Whether any artifact changes were detected'
        value: ${{ jobs.detect-changes.outputs.has_changes }}
      artifacts_changed:
        description: 'JSON string of changed artifacts (full changed-artifacts.json structure)'
        value: ${{ jobs.detect-changes.outputs.artifacts_changed }}

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Artifacts
    runs-on: ubuntu-latest

    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
      artifacts_changed: ${{ steps.detect.outputs.artifacts_changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need at least 2 commits for diff

      - name: Set up Python virtual environment
        uses: ./.github/actions/setup-venv

      - name: Run change detection
        id: detect
        run: |
          $VENV_PYTHON scripts/detect_changes.py
      
      - name: Upload changed-artifacts.json
        uses: actions/upload-artifact@v4
        with:
          name: changed-artifacts
          path: changed-artifacts.json
          retention-days: 7
      
      - name: Display results
        run: |
          echo "### 📋 Change Detection Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f changed-artifacts.json ]; then
            ARTIFACT_COUNT=$(jq '.total_artifacts' changed-artifacts.json)
            FILE_COUNT=$(jq '.total_files' changed-artifacts.json)
            
            echo "- **Artifacts Changed**: $ARTIFACT_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- **Files Changed**: $FILE_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ "$ARTIFACT_COUNT" -gt 0 ]; then
              echo "#### Changed Artifacts" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              jq -r '.changed_artifacts[] | "- **\(.name)** (\(.type)): \(.changed_files | length) files"' changed-artifacts.json >> $GITHUB_STEP_SUMMARY
            else
              echo "No artifact changes detected." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ changed-artifacts.json not found" >> $GITHUB_STEP_SUMMARY
          fi
