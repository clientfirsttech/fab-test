name: Publish to PyPI

# Final releases and public pre-releases (alpha, beta, rc). The previous filter
# was `v[0-9]+.[0-9]+.[0-9]+*`, whose trailing glob matches `v1.0.0.0.dev1` --
# the first rehearsal tag would have gone to production. Dev releases go to
# publish-testpypi.yml; each tag shape reaches exactly one of the two.
#
# The glob is the first line of defence, not the only one: check_release_target
# reads the version out of the built wheel, because that is the artifact being
# uploaded and a tag is only a claim about it.
#
# Both a three- and a four-component release, because this project's versions
# carry four (1.0.0.0.dev1 leads to 1.0.0.0) and a glob that only accepted
# three would silently never fire for the release it exists to publish.
# Neither pattern ends in a glob, which is the whole bug being fixed.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"
      # A public beta (v1.8.1b1): PyPI serves it to `pip install --pre` and
      # hides it from a bare `pip install`.
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      # Trusted publishing resolves by distribution name. This said
      # fabric-ci-cd-dataops, which is the repository, not what it builds.
      url: https://pypi.org/p/cft-fab-test
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build packaging

      - name: Build wheel and sdist
        run: python -m build

      - name: Check wheel contents
        run: python .github/scripts/check_wheel_contents.py

      # Renders README as the index will render it and fails on anything
      # PyPI would reject. --strict promotes warnings to errors: a warning
      # here is discovered at upload, which is after the version is spent.
      - name: Check distribution metadata renders
        run: |
          pip install twine
          twine check --strict dist/*

      # Must precede the upload: a guard that runs afterwards guards nothing.
      - name: Refuse a dev release or a mismatched tag
        run: python .github/scripts/check_release_target.py

      - name: Classify the release
        id: release
        run: echo "prerelease=$(python .github/scripts/check_release_target.py --print-prerelease)" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # A beta must not become the repository's "Latest release".
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          files: dist/*
