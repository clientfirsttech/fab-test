name: TestBed Run Validators

description: |
  Runs all Python validators found under .fabric/testbed/validators/<artifact_type>/
  against the deployed test artifact. Each validator receives --artifact-name and
  --workspace-id arguments. Continues on error so all validators always execute.

inputs:
  artifact_type:
    description: Type of the artifact (SemanticModel, Report, Agent, etc.)
    required: true
  test_artifact_name:
    description: Name of the cloned test artifact (original name + _TEST)
    required: true
  workspace_id:
    description: Fabric workspace ID for the testbed environment
    required: true
  terse:
    description: Pass --terse to validators for machine-readable output (validators must support the flag)
    required: false
    default: "false"

outputs:
  validation_passed:
    description: Whether all validators passed (true/false)
    value: ${{ steps.validate.outputs.validation_passed }}

runs:
  using: composite

  steps:
    - name: Run TestBed validation suite
      id: validate
      shell: bash
      run: |
        echo "🔍 Running TestBed validation suite" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        VALIDATORS_DIR=".fabric/testbed/validators/${{ inputs.artifact_type }}"
        VALIDATION_PASSED=true

        if [ -d "$VALIDATORS_DIR" ]; then
          for validator in "$VALIDATORS_DIR"/*.py; do
            if [ -f "$validator" ]; then
              VALIDATOR_NAME=$(basename "$validator" .py)
              echo "Running validator: $VALIDATOR_NAME"

              $VENV_PYTHON "$validator" \
                --artifact-name "${{ inputs.test_artifact_name }}" \
                --workspace-id "${{ inputs.workspace_id }}" \
                ${{ inputs.terse == 'true' && '--terse' || '' }}

              if [ $? -eq 0 ]; then
                echo "✅ $VALIDATOR_NAME: PASSED" >> $GITHUB_STEP_SUMMARY
              else
                echo "❌ $VALIDATOR_NAME: FAILED" >> $GITHUB_STEP_SUMMARY
                VALIDATION_PASSED=false
              fi
            fi
          done
        else
          echo "ℹ️  No validators found for ${{ inputs.artifact_type }}" >> $GITHUB_STEP_SUMMARY
          echo "Skipping validation suite" >> $GITHUB_STEP_SUMMARY
        fi

        echo "validation_passed=$VALIDATION_PASSED" >> $GITHUB_OUTPUT
