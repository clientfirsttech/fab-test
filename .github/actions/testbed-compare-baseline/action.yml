name: TestBed Compare Baseline

description: |
  Compares the deployed test artifact against a stored JSON baseline file under
  .fabric/testbed/baselines/<artifact_type>/<artifact_name>.json using
  scripts/compare_baseline.py. Outputs the comparison result as JSON.

inputs:
  artifact_name:
    description: Original artifact name (without _TEST suffix)
    required: true
  artifact_type:
    description: Type of the artifact (SemanticModel, Report, Agent, etc.)
    required: true
  test_artifact_name:
    description: Name of the cloned test artifact (original name + _TEST)
    required: true
  workspace_id:
    description: Fabric workspace ID for the testbed environment
    required: true
  terse:
    description: Pass --terse to compare_baseline.py for machine-readable output
    required: false
    default: "false"

outputs:
  baseline_comparison:
    description: JSON result from baseline comparison script
    value: ${{ steps.compare.outputs.baseline_comparison }}

runs:
  using: composite

  steps:
    - name: Compare against baseline
      id: compare
      shell: bash
      run: |
        echo "📊 Comparing against baseline" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        BASELINE_DIR=".fabric/testbed/baselines/${{ inputs.artifact_type }}"
        BASELINE_FILE="$BASELINE_DIR/${{ inputs.artifact_name }}.json"

        COMPARISON_RESULT='{"baseline_exists": false}'

        if [ -f "$BASELINE_FILE" ]; then
          echo "Found baseline: $BASELINE_FILE"

          if $VENV_PYTHON scripts/compare_baseline.py \
            --artifact-name "${{ inputs.test_artifact_name }}" \
            --workspace-id "${{ inputs.workspace_id }}" \
            --baseline-file "$BASELINE_FILE" \
            --output-json "baseline-comparison.json" \
            ${{ inputs.terse == 'true' && '--terse' || '' }}; then

            COMPARISON_RESULT=$(cat baseline-comparison.json)
            echo "✅ Baseline comparison: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Baseline comparison: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "See comparison details below" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "ℹ️  No baseline found for ${{ inputs.artifact_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Skipping baseline comparison" >> $GITHUB_STEP_SUMMARY
        fi

        echo "baseline_comparison=$COMPARISON_RESULT" >> $GITHUB_OUTPUT
