name: TestBed Deploy Artifact

description: |
  Deploys a cloned test artifact to the testbed Fabric workspace using
  Fabric CI/CD Python (Constraint C2). Requires VENV_PYTHON to be set by
  the setup-venv action.

inputs:
  test_artifact_path:
    description: Path to the cloned test artifact directory
    required: true
  environment:
    description: Target environment name (testbed)
    required: false
    default: testbed
  workspace_id:
    description: Fabric workspace ID for the testbed environment
    required: true
  fabric_tenant_id:
    description: Azure AD tenant ID for service principal authentication
    required: true
  fabric_service_principal_id:
    description: Service principal client ID for Fabric API authentication
    required: true
  fabric_service_principal_secret:
    description: Service principal client secret for Fabric API authentication
    required: true
  terse:
    description: Pass --terse to deploy.py for machine-readable output
    required: false
    default: "false"

outputs:
  deployment_success:
    description: Whether deployment succeeded (true/false)
    value: ${{ steps.deploy.outputs.deployment_success }}

runs:
  using: composite

  steps:
    - name: Deploy to TestBed workspace
      id: deploy
      shell: bash
      env:
        FABRIC_WORKSPACE_ID: ${{ inputs.workspace_id }}
        FABRIC_TENANT_ID: ${{ inputs.fabric_tenant_id }}
        FABRIC_SERVICE_PRINCIPAL_ID: ${{ inputs.fabric_service_principal_id }}
        FABRIC_SERVICE_PRINCIPAL_SECRET: ${{ inputs.fabric_service_principal_secret }}
      run: |
        echo "🚀 Deploying to TestBed workspace" >> $GITHUB_STEP_SUMMARY

        $VENV_PYTHON scripts/deploy.py \
          --artifact "${{ inputs.test_artifact_path }}" \
          --environment "${{ inputs.environment }}" \
          ${{ inputs.terse == 'true' && '--terse' || '' }}

        if [ $? -eq 0 ]; then
          echo "✅ Deployment succeeded" >> $GITHUB_STEP_SUMMARY
          echo "deployment_success=true" >> $GITHUB_OUTPUT
        else
          echo "❌ Deployment failed" >> $GITHUB_STEP_SUMMARY
          echo "deployment_success=false" >> $GITHUB_OUTPUT
          exit 1
        fi
