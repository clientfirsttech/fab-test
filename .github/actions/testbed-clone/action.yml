name: TestBed Clone Artifact

description: |
  Clones a Fabric artifact with a _TEST suffix for isolated testbed deployment.
  Updates .platform metadata to reflect the test naming.

inputs:
  artifact_name:
    description: Name of the artifact to clone
    required: true
  artifact_path:
    description: Path to the artifact directory
    required: true

outputs:
  test_artifact_name:
    description: Name of the cloned test artifact (original name + _TEST)
    value: ${{ steps.clone.outputs.test_artifact_name }}
  test_artifact_path:
    description: Path to the cloned test artifact directory
    value: ${{ steps.clone.outputs.test_artifact_path }}

runs:
  using: composite

  steps:
    - name: Clone artifact with test naming
      id: clone
      shell: bash
      run: |
        TEST_ARTIFACT_NAME="${{ inputs.artifact_name }}_TEST"
        TEST_PATH="${{ inputs.artifact_path }}_TEST"

        echo "📋 Cloning artifact: ${{ inputs.artifact_name }} → $TEST_ARTIFACT_NAME" >> $GITHUB_STEP_SUMMARY

        cp -r "${{ inputs.artifact_path }}" "$TEST_PATH"

        if [ -f "$TEST_PATH/.platform" ]; then
          if jq --arg name "$TEST_ARTIFACT_NAME" '.metadata.displayName = $name' "$TEST_PATH/.platform" > "$TEST_PATH/.platform.tmp"; then
            mv "$TEST_PATH/.platform.tmp" "$TEST_PATH/.platform"
            echo "✅ Updated .platform file with test naming" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  Could not update .platform file (non-critical)" >> $GITHUB_STEP_SUMMARY
            rm -f "$TEST_PATH/.platform.tmp"
          fi
        fi

        echo "test_artifact_name=$TEST_ARTIFACT_NAME" >> $GITHUB_OUTPUT
        echo "test_artifact_path=$TEST_PATH" >> $GITHUB_OUTPUT
