# User journey: check the values a PBIR report's slicers open with
# Source: a report developer's request (2026-11-14). Customer-agreed slicer
# defaults drift when the report is edited, and some defaults must follow the
# calendar (the current semester) with nobody remembering to move them.
# Epic: tasks/archive/2026-11-14-pbir-slicer-default-state.md
id: p5puo3stoc7jduf4ahxs857j
name: PBIR Slicer Default State
description: >
  The values a report's slicers open with -- field parameters and
  calendar-driven periods included -- are captured once as a per-report ODCS
  contract and checked by `fab-test pbir`, on every change and on a schedule,
  so neither an edit nor a calendar rollover silently changes what the
  customer sees first.
createdAt: 1794708391857
updatedAt: 1794708391857
personas: [s6ua5spy9sn1snxsdgivqour, hxl1drwi9gxpwvszy63j5hla, vzm8qmbzgyzjoh0d42xuf7ch]

painPoints:
  - id: ii23bw9nwc0hg3dycmkyd9cb
    name: Working selection saved over the agreed default
    description: >
      A slicer is saved with whatever was selected while editing, and nobody
      remembers what the customer agreed it should open with.
    impact: 7
    frequency: 7
  - id: kww7g2t9eq1e013npfuoylyb
    name: Report-specific checks are hand-written JSON Logic
    description: >
      rules.pbir.extend works, but the rule targets hex visual IDs and
      DAX-quoted literals ('Bad', 2024L), and it runs against every report in
      the run, not the one it was written for.
    impact: 6
    frequency: 8
  - id: evwql1r4acz7y4xvdzqfy5jf
    name: Calendar-driven defaults go stale at rollover
    description: >
      A default such as the current semester has to be moved by hand; a
      rollover changes no file, so change-triggered CI never notices.
    impact: 8
    frequency: 3
  - id: z4cdbpte7zzkk2xxz3lppewt
    name: Field-parameter starting point lost
    description: Charts driven by a field parameter open on the wrong measure or axis.
    impact: 5
    frequency: 5
  - id: qfu2h2to8zim4zpv6uneb248
    name: Bookmarks drift from visual visibility
    description: >
      A bookmark still names a deleted visual, or never captured a visual added
      later, so applying it leaves the page in an unplanned state.
    impact: 7
    frequency: 5
  - id: n7038p2ridpetd2t0sjidsq0
    name: Bookmark navigator opens on the wrong bookmark
    description: The navigator's preselected bookmark changes during editing.
    impact: 5
    frequency: 4

steps:
  - id: zccfy30vxfbp4lf3featxrqe
    name: Build the contract
    description: >
      `fab-test pbir contract init` finds the report's slicers and their current
      selections, asks how each should be checked, and creates or appends the
      report's contract -- on a terminal, or through an agent via JSON questions
      and an answers file.
    userStories:
      - id: mzs0nfqcusobfiybglacir1y
        name: Generate from the report
        story: As a Local Developer, I want the generator to find my slicers and their current selections and ask how to check each, so that I don't have to remember or hand-write the agreed defaults.
        painPoint: ii23bw9nwc0hg3dycmkyd9cb
        priority: 49
        status: { state: inProgress, comment: PBIR Slicer Default State epic, built 2026-11-14 on a feature branch }
      - id: dfnmbnh7glloruv2dmx8ua8o
        name: Answer through an agent
        story: As an AI Agent, I want the generator's questions as JSON with suggested answers and a flag that applies an answers file, so that I can build the contract with the developer without a terminal.
        painPoint: kww7g2t9eq1e013npfuoylyb
        priority: 48
        status: { state: inProgress, comment: PBIR Slicer Default State epic, built 2026-11-14 on a feature branch }
      - id: jczgz46g8wfqjbzng8ayu4oe
        name: Calendar-driven expectation
        story: As a Local Developer, I want an expected value written as a format over my report's own fiscal calendar, so that the check follows the semester without a rule edit.
        painPoint: evwql1r4acz7y4xvdzqfy5jf
        priority: 24
        status: { state: inProgress, comment: PBIR Slicer Default State epic, built 2026-11-14 on a feature branch }
  - id: lql9m2xys8zs1pb4z8x9t5kq
    name: Run the check
    description: >
      `fab-test pbir` compiles each report's contract into JSON Logic for that
      report only; Fab Inspector evaluates it alongside the packaged rules.
    userStories:
      - id: induewn8clolporsi5immi6z
        name: One report's expectations, one report
        story: As a CI Pipeline, I want a contract compiled into rules for its own report only, so that one report's expectations never fail another.
        painPoint: kww7g2t9eq1e013npfuoylyb
        priority: 48
        status: { state: inProgress, comment: PBIR Slicer Default State epic, built 2026-11-14 on a feature branch }
      - id: fg5j37an00wph7x7n6pt3lo9
        name: Findings name page, field, expected and actual
        story: As a Local Developer, I want each finding to name the page, the slicer's field, the expected and the actual selection, so that I can fix it without opening JSON.
        painPoint: ii23bw9nwc0hg3dycmkyd9cb
        priority: 49
        status: { state: inProgress, comment: PBIR Slicer Default State epic, built 2026-11-14 on a feature branch }
      - id: vd7cll1ukzvyk6nex19sb0ue
        name: Field-parameter slicers
        story: As a Local Developer, I want a field-parameter slicer's starting selection checked like any other slicer, so that charts open on the agreed measure.
        painPoint: z4cdbpte7zzkk2xxz3lppewt
        priority: 25
        status: { state: inProgress, comment: PBIR Slicer Default State epic, built 2026-11-14 on a feature branch }
      - id: t8youxz52fhcuwlsntymd7fh
        name: Reproducible calendar date
        story: As a CI Pipeline, I want `--as-of DATE` and every resolved value recorded in the envelope, so that a calendar-driven failure can be reproduced on any day.
        painPoint: evwql1r4acz7y4xvdzqfy5jf
        priority: 24
        status: { state: inProgress, comment: PBIR Slicer Default State epic, built 2026-11-14 on a feature branch }
  - id: ii23bw9nwc0hg3dycmkyd9cc
    name: Catch the rollover
    description: A scheduled pipeline run fails when the calendar has moved past a default, with no commit needed.
    userStories:
      - id: kww7g2t9eq1e013npfuoylyc
        name: Scheduled run
        story: As a CI Pipeline, I want a documented scheduled workflow, so that a semester rollover fails a run even when nothing was committed.
        painPoint: evwql1r4acz7y4xvdzqfy5jf
        priority: 24
        status: { state: inProgress, comment: PBIR Slicer Default State epic, built 2026-11-14 on a feature branch }
  - id: evwql1r4acz7y4xvdzqfy5jg
    name: Remediate
    description: An agent fixes the slicer selection from the finding.
    userStories:
      - id: z4cdbpte7zzkk2xxz3lppewu
        name: Agent fixes the selection
        story: As an AI Agent, I want each finding's expected value and the slicer's file path, so that I can update the selection in visual.json without guessing.
        painPoint: ii23bw9nwc0hg3dycmkyd9cb
        priority: 49
        status: { state: inProgress, comment: PBIR Slicer Default State epic, built 2026-11-14 on a feature branch }
  - id: qfu2h2to8zim4zpv6uneb249
    name: Bookmarks (later)
    description: Logged 2026-11-14 for a later epic; not in PBIR Slicer Default State.
    userStories:
      - id: n7038p2ridpetd2t0sjidsq1
